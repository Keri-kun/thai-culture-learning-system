    <style>
        /* Modern Notification Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .custom-modal {
            background: rgba(255, 255, 255, 0.95);
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.show .custom-modal {
            transform: translateY(0);
        }

        .custom-modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--gold-gradient);
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff3cd;
            color: #856404;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(212, 167, 44, 0.2);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .modal-message {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: #333;
        }
    </style>

        function showNotification(title, message, icon = '⚠️') {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('notificationModal').classList.add('show');
        }

        function closeNotification() {
            document.getElementById('notificationModal').classList.remove('show');
        }

        function renderQuiz() {
            let html = '<p style="color: #666; margin-bottom: 20px;">📌 ต้องตอบถูก 12 ข้อขึ้นไปจาก 20 ข้อ จึงจะผ่าน</p>';
            quizQuestions.forEach((q, i) => {
                html += '<div style="margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid #e2e8f0;">';
                html += '<p style="font-weight: 600; font-size: 18px; margin-bottom: 15px;">ข้อ ' + (i + 1) + '. ' + q.question + '</p>';
                q.options.forEach((opt, j) => {
                    html += '<div class="quiz-option" onclick="selectAnswer(' + q.id + ',' + j + ')" data-qid="' + q.id + '" data-idx="' + j + '">';
                    html += '<input type="radio" name="q' + q.id + '" style="margin-right: 10px;" disabled>' + opt;
                    html += '</div>';
                });

                html += '</div>';
            });
            html += '<button class="btn btn-success" style="width: 100%;" onclick="submitQuiz()">ส่งคำตอบ</button>';
            document.getElementById('quizContent').innerHTML = html;
        }

        function selectAnswer(qId, optIdx) {
            quizAnswers[qId] = optIdx;
            const opts = document.querySelectorAll('[data-qid="' + qId + '"]');
            opts.forEach(o => {
                o.classList.remove('selected');
                o.querySelector('input').checked = false;
            });
            const selected = document.querySelector('[data-qid="' + qId + '"][data-idx="' + optIdx + '"]');
            selected.classList.add('selected');
            selected.querySelector('input').checked = true;
        }

        function submitQuiz() {
            const answeredCount = Object.keys(quizAnswers).length;
            if (answeredCount < quizQuestions.length) {
                showNotification(
                    'ตอบคำถามไม่ครบถ้วน',
                    `กรุณาตอบคำถามให้ครบทั้ง ${quizQuestions.length} ข้อ\n(คุณตอบไปแล้ว ${answeredCount} ข้อ)`,
                    '📝'
                );
                return;
            }

            let correct = 0;
            let results = [];
            quizQuestions.forEach(q => {
                const isCorrect = quizAnswers[q.id] === q.correct;
                if (isCorrect) correct++;
                results.push({
                    question: q.question,
                    yourAnswer: q.options[quizAnswers[q.id]],
                    correctAnswer: q.options[q.correct],
                    isCorrect: isCorrect
                });
            });

            const quizScore = (correct / quizQuestions.length) * 100;

            // Save score to localStorage
            localStorage.setItem('quizScore', quizScore);

            document.getElementById('quizContent').classList.add('hidden');
            const isPass = correct >= 12;
            let html = '<div class="score-display ' + (isPass ? 'score-pass' : 'score-fail') + '">' + correct + '/20 (' + quizScore.toFixed(0) + '%)</div>';
            html += '<h3 style="text-align: center; margin-bottom: 20px;">' + (isPass ? '🎉 ยินดีด้วย! คุณผ่านการทดสอบ' : '😔 เสียใจด้วย คุณยังไม่ผ่านการทดสอบ') + '</h3>';
            html += '<p style="text-align: center; margin-bottom: 30px; font-size: 18px;">ตอบถูก <strong style="color: #48bb78;">' + correct + '</strong> จาก <strong>' + quizQuestions.length + '</strong> ข้อ (เกณฑ์ผ่าน 12 ข้อ)</p>';

            html += '<div style="background: #f7fafc; padding: 20px; border-radius: 8px; margin-bottom: 20px; max-height: 300px; overflow-y: auto;">';
            html += '<h4 style="margin-bottom: 15px;">📋 สรุปผลการทดสอบ:</h4>';
            results.forEach((r, i) => {
                const icon = r.isCorrect ? '✅' : '❌';
                const color = r.isCorrect ? '#48bb78' : '#f56565';
                html += '<div style="margin-bottom: 15px; padding: 10px; background: white; border-radius: 5px; border-left: 4px solid ' + color + ';">';
                html += '<p style="font-weight: 600;">' + icon + ' ข้อ ' + (i + 1) + ': ' + r.question + '</p>';
                html += '<p style="margin: 5px 0; color: #666;">คำตอบของคุณ: ' + r.yourAnswer + '</p>';
                if (!r.isCorrect) {
                    html += '<p style="color: #48bb78;">คำตอบที่ถูกต้อง: ' + r.correctAnswer + '</p>';
                }
                html += '</div>';
            });
            html += '</div>';

            if (isPass) {
                html += '<button class="btn btn-success" style="width: 100%;" onclick="window.location.href=\'survey.html\'">ดำเนินการต่อ - กรอกแบบสอบถาม</button>';
            } else {
                html += '<button class="btn" style="width: 100%;" onclick="retakeQuiz()">ทำแบบทดสอบใหม่อีกครั้ง</button>';
            }
            document.getElementById('quizResult').innerHTML = html;
            document.getElementById('quizResult').classList.remove('hidden');
        }

        function retakeQuiz() {
            quizAnswers = {};
            document.getElementById('quizContent').classList.remove('hidden');
            document.getElementById('quizResult').classList.add('hidden');
            renderQuiz();
        }

        renderQuiz();
    </script>
</body>

</html>
